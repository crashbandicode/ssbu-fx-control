[package]
name = "ssbu-fx-control"
version = "0.2.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Per-fighter character effect control (On / Off / Reduced) for Smash Ultimate 13.0.5 with measured per-move Reduced variants, as one Skyline NRO."

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
# Online Deluxe plugin SDK: menu rows on Deluxe's window and its online context.
# Resolved at runtime; this NRO also runs without Deluxe installed.
# Pinned to the Deluxe reduction candidate: SDK 5.0.0 (descriptor version 4 only, no retry chain),
# host accepts versions 2 to 4.
deluxe-plugin-sdk = { git = "https://git.syntaxbyexample.com/intpa/ssbu-online-deluxe-rewrite", rev = "ecb99238f02bc1ecc18666cc65e5d9fb981d3f57" }

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
debug = 2
strip = false
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
