[package]
name = "ssbu-fx-control"
version = "0.3.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Per-fighter character effect control (On / Off / Reduced) and stage background visuals (On / Off) for Smash Ultimate 13.0.5, with measured per-move Reduced variants, as one Skyline NRO."

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
# cdylib only: Cargo skips LTO for a library that is also an rlib, and the
# unit tests do not need one.
crate-type = ["cdylib"]

[features]
default = []

[dependencies]
# Online Deluxe plugin SDK: menu rows on Deluxe's window and its online context.
# Resolved at runtime; this NRO also runs without Deluxe installed.
# Pinned to Deluxe 0.5.4 (a63bc8c): SDK 5.0.0 (descriptor version 4 only, no retry chain),
# host accepts versions 2 to 4, so the page needs Deluxe 0.5.3 or later.
deluxe-plugin-sdk = { git = "https://git.syntaxbyexample.com/intpa/ssbu-online-deluxe-rewrite", rev = "a63bc8c" }

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
debug = 2
strip = false
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
