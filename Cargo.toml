[package]
name = "ssbu-fx-control"
version = "0.1.0"
edition = "2021"
publish = false
build = "build.rs"
description = "Per-fighter character effect control (On / Off / Reduced) for Smash Ultimate 13.0.5, as one Skyline NRO."

[package.metadata.skyline]
titleid = "01006A800016E000"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Host-only EFF-variant availability controls for tests; omitted from NRO builds.
variant-test = []

[dependencies]
# Online Deluxe plugin SDK: menu rows on Deluxe's window and its online context.
# Resolved at runtime; this NRO also runs without Deluxe installed.
deluxe-plugin-sdk = { path = "/home/intpa/ssbu-online-deluxe-rewrite/sdk/sdk" }

[target.'cfg(target_os = "switch")'.dependencies]
skyline = "=0.6.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
debug = 2
strip = false
lto = "thin"
codegen-units = 1

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("switch"))'] }
