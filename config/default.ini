# ssbu-fx-control. Values: on | off | reduced. scope: online | all.
# The all key is applied first and every fighter line overrides it. It is
# written only while every fighter has the same value.
# Default: every effect on; fighter changes apply only online, outside Training.
scope=online
all=on
captain_falcon=on
ness=on
lucas=on
palutena=on
sephiroth=on
pyra=on
mythra=on
byleth=on
inkling=on
kirby=on
# Stage backgrounds apply offline/online, separate from fighter All and Scope.
# All eleven legal stages offer On/Off for selected scenery/particles.
# Reload stage after edits. Exact targets and limitations: docs/STAGES.md.
stages=on
stage.battle_field=on
stage.battle_field_s=on
stage.end=on
stage.yoshi_cartboard=on
stage.fox_lylatcruise=on
stage.poke_stadium2=on
stage.animal_village=on
stage.poke_kalos=on
stage.animal_city=on
stage.ff_cave=on
stage.trail_castle=on
