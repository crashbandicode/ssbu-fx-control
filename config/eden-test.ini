# Offline + online test override for Eden. Copy to
# sd:/ultimate/ssbu_fx_control/config.ini with the matching NRO while Eden is closed.
# scope=all lets offline matches and Training exercise the policy. Every row
# starts On so a test begins from full visuals; set a row to off or reduced
# (or all=off / all=reduced) for the case under test.
scope=all
all=on
captain_falcon=on
ness=on
lucas=on
palutena=on
sephiroth=on
pyra=on
mythra=on
byleth=on
inkling=on
kirby=on
# Stage backgrounds apply offline/online, separate from fighter All and Scope.
# All eleven legal stages offer On/Off for selected scenery/particles.
# Reload stage after edits. Exact targets and limitations: docs/STAGES.md.
stages=on
stage.battle_field=on
stage.battle_field_s=on
stage.end=on
stage.yoshi_cartboard=on
stage.fox_lylatcruise=on
stage.poke_stadium2=on
stage.animal_village=on
stage.poke_kalos=on
stage.animal_city=on
stage.ff_cave=on
stage.trail_castle=on
