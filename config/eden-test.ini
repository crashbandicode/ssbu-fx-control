# Offline + online test override for Eden. Copy to
# sd:/ultimate/ssbu_fx_control/config.ini with the matching NRO while Eden is closed.
# scope=all lets offline matches and Training exercise the policy. Every row
# starts On so a test begins from full visuals; set a row to off or reduced
# (or all=off / all=reduced) for the case under test.
scope=all
all=on
kazuya=on
captain_falcon=on
ness=on
lucas=on
ike=on
chrom=on
roy=on
palutena=on
sephiroth=on
pyra=on
mythra=on
byleth=on
inkling=on
ganondorf=on
